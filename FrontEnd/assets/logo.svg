<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5" />

  <!-- Terminal Top Bar Dots -->
  <circle cx="30" cy="30" r="4" fill="#ef4444" opacity="0.9" />
  <circle cx="44" cy="30" r="4" fill="#eab308" opacity="0.9" />
  <circle cx="58" cy="30" r="4" fill="#22c55e" opacity="0.9" />

  <!-- Prompt Chevron (>) -->
  <path d="M 32 50 L 52 65 L 32 80" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Prompt Cursor (_) -->
  <rect x="62" y="74" width="26" height="6" rx="3" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
